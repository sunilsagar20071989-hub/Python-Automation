name: Stocks Hourly Screener Workflow

on:
  schedule:
    # 03:45 UTC = 09:15 AM IST
    # 04:15-09:15 UTC (every hour at :15) = 09:45 AM to 02:45 PM IST
    - cron: '45 3,4-9 * * 1-5'
  workflow_dispatch: # Manual trigger button

concurrency:
  group: stock-screeners-engine
  cancel-in-progress: true

jobs:
  run-stock-screeners:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance ta requests pytz python-dotenv openpyxl pyotp smartapi-python logzero websocket-client
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Auto-Clean Non-Breaking Spaces
        run: |
          python -c "
          import glob
          for filepath in glob.glob('*.py'):
              with open(filepath, 'rb') as f:
                  content = f.read()
              cleaned = content.replace(b'\xc2\xa0', b' ')
              with open(filepath, 'wb') as f:
                  f.write(cleaned)
          "
          sed -i 's/\xc2\xa0/ /g' *.py || true

      - name: Run Hybrid Quant Screener
        env:
          FULL_MARKET_MAX_STOCKS: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Kolkata"
        run: python quant_hybrid_engine.py

      - name: Run FnO Option 15Min Screener
        if: always()
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Kolkata"
        run: python fno_option_15min_screener.py

      - name: Run Advanced Stock Screener
        if: always()
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Kolkata"
        run: python advanced_stock_screener.py

      - name: Run Intraday Screener
        if: always()
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Kolkata"
        run: python intraday_screener.py

name: Stocks Hourly Screener Workflow

on:
  schedule:
    # 03:45 UTC = 09:15 AM IST
    # 04:15-09:15 UTC (every hour at :15) = 09:45 AM to 02:45 PM IST
    - cron: '45 3,4-9 * * 1-5'
  workflow_dispatch: # Manual trigger button

concurrency:
  group: stock-screeners-engine
  cancel-in-progress: true

jobs:
  run-stock-screeners:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyotp smartapi-python python-dotenv ta logzero websocket-client
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run FnO Option 15Min Screener
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Kolkata"
        run: python fno_option_15min_screener.py

      - name: Run Advanced Stock Screener
        if: always() # Runs even if previous step fails
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Kolkata"
        run: python advanced_stock_screener.py

      - name: Run Intraday Screener
        if: always() # Runs even if previous step fails
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Kolkata"
        run: python intraday_screener.py

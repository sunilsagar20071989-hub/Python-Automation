name: Stocks hourly Screener Workflow

on:
  schedule:
    # Runs every hour at minute 15 during trading hours (03:45 UTC to 09:45 UTC = 9:15 AM to 3:15 PM IST)
    - cron: '15 4-10 * * 1-5'
  workflow_dispatch: # Manual run button for testing

jobs:
  run-stock-screeners:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyotp smartapi-python python-dotenv ta logzero websocket-client
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Stock Screeners
        env:
          SMARTAPI_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nifty_stock_fno_master_screener.py
          python fno_option_15min_screener.py
          python advanced_stock_screener.py
          python intraday_screener.py

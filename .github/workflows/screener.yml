name: nifty_algo.py
name: advanced_stock_screener.py
name: backtest.py   
name: nifty_algo_paper.py
name: fno_option_15min_screener.py 
name: nifty_stock_fno_master_screener.py
name: telegram_bot.py
name: fetch_trades.py
name: daily_trade_log.csv
name: run_all_scripts.bat
on:
  workflow_dispatch: # Direct Manual Run button ke liye
  schedule:
    - cron: '30 3 * * 1-5' # Indian Standard Time (IST) 9:00 AM (Monday-Friday)

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyotp ta requests smartapi-python python-dotenv

    - name: Execute FNO Screener Script
      env:
        SMARTAPI_KEY: ${{ secrets.SMARTAPI_KEY }}
        CLIENT_CODE: ${{ secrets.CLIENT_CODE }}
        PIN: ${{ secrets.PIN }}
        TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py

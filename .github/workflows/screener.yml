name: Live Market Hours Stock Screener (1-Hour Schedule)

on:
  schedule:
    # Monday to Friday: Har 1 ghante par (9:15 AM, 10:15 AM, 11:15 AM, 12:15 PM, 1:15 PM, 2:15 PM, 3:15 PM IST)
    - cron: '15 3-9 * * 1-5'
  # Manual trigger option testing ke liye
  workflow_dispatch:

jobs:
  run-live-screeners:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests ta pyotp smartapi-python python-dotenv logzero websocket-client

      - name: Execute Live Intraday & F&O Screeners
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nifty_stock_fno_master_screener.py
          python fno_option_15min_screener.py
          python advanced_stock_screener.py
          python intraday_screener.py
          python nifty_algo.py

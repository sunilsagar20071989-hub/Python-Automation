name: Automated FNO & Nifty Strategy Pipeline

on:
  workflow_dispatch: # Manual Run button ke liye
  schedule:
    - cron: '30 3 * * 1-5' # Indian Standard Time (IST) 9:00 AM (Mon-Fri)

jobs:
  run-all-strategies:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Required Libraries
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyotp ta requests logzero smartapi-python python-dotenv websocket-client

    - name: Execute All Trading & Screening Scripts
      env:
        SMARTAPI_KEY: ${{ secrets.SMARTAPI_KEY }}
        CLIENT_CODE: ${{ secrets.CLIENT_CODE }}
        PIN: ${{ secrets.PIN }}
        TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python nifty_stock_fno_master_screener.py
        python fno_option_15min_screener.py
        python advanced_stock_screener.py
        python nifty_algo.py
        python nifty_algo_paper.py
        python backtest.py
        python fetch_trades.py
        python telegram_bot.py

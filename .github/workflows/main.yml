name: Run Python Automation Scripts

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1-5' # 08:45 AM IST (Mon-Fri)

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    env:
      ANGEL_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
      ANGEL_MPIN: ${{ secrets.SMARTAPI_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
      SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
      SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
      SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
      SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyTelegramBotAPI smartapi-python pyotp ta logzero pytz

      - name: Clean Non-Breaking Spaces
        run: |
          python -c "import glob; [open(p, 'w', encoding='utf-8').write(open(p, encoding='utf-8', errors='ignore').read().replace('\u00a0', ' ')) for p in glob.glob('*.py')]"

      - name: Execute All Python Scripts
        run: |
          python -u advanced_stock_screener.py || true
          python -u backtest.py || true
          python -u fetch_trades.py || true
          python -u fno_option_15min_screener.py || true
          python -u nifty_algo.py || true
          python -u nifty_algo_paper.py || true
          python -u nifty_stock_fno_master_screener.py || true
          python -u telegram_bot.py || true

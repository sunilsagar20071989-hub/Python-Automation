name: Hybrid Quant Screener Engine

on:
  schedule:
    - cron: '35 3 * * 1-5'  # 9:05 AM IST
    - cron: '0 4 * * 1-5'   # 9:30 AM IST
    - cron: '0 10 * * 1-5'  # 3:30 PM IST
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    env:
      FULL_MARKET_MAX_STOCKS: "0"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance ta requests pytz python-dotenv openpyxl

      - name: Auto-Clean Non-Breaking Spaces in Python Scripts
        run: |
          python -c "
          import glob
          for filepath in glob.glob('*.py'):
              with open(filepath, 'rb') as f:
                  content = f.read()
              cleaned = content.replace(b'\xc2\xa0', b' ')
              with open(filepath, 'wb') as f:
                  f.write(cleaned)
          "
          sed -i 's/\xc2\xa0/ /g' quant_hybrid_engine.py || true

      - name: Execute Master Screener Engine
        run: python quant_hybrid_engine.py

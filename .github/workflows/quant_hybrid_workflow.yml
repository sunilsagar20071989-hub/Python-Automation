name: Quant Full Market Screener Workflow

on:
  schedule:
    # Market Hours (IST): 09:45, 10:45, 11:45, 12:45, 13:45, 14:45
    # UTC Times: 04:15, 05:15, 06:15, 07:15, 08:15, 09:15 (Monday to Friday)
    - cron: '15 4-9 * * 1-5'
  workflow_dispatch: # Manual Run Button (Jab chahein tab click karke run karein)

jobs:
  run-quant-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Required Libraries
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyotp smartapi-python python-dotenv ta pytz bs4

      - name: Execute Full Market Screener
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Kolkata"
        run: |
          python quant_hybrid_engine.py

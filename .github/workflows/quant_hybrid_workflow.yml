name: Quant Hybrid Screener Run

on:
  schedule:
    # Mon-Fri 9:15 AM to 3:30 PM IST
    - cron: '15,30,45,0 4-9 * * 1-5'
  workflow_dispatch: # Manual Run Button Enable Karta Hai

concurrency:
  group: smartapi-screener
  cancel-in-progress: true

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pandas ta beautifulsoup4 requests pyotp pytz

      - name: Execute Screener
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FULL_MARKET_MAX_STOCKS: "100"
        run: python quant_hybrid_engine.py

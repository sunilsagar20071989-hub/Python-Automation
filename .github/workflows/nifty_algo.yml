name: Nifty Algo Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1-5' # 08:45 AM IST (Mon-Fri, pre-market / market prep)

permissions:
  contents: write

jobs:
  run-nifty-algo:
    runs-on: ubuntu-latest

    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
      SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
      SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
      SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp pandas requests pyTelegramBotAPI pytz ta logzero

      - name: Clean Non-Breaking Spaces
        run: |
          python -c "import glob; [open(p, 'w', encoding='utf-8').write(open(p, encoding='utf-8', errors='ignore').read().replace('\u00a0', ' ')) for p in glob.glob('*.py')]"

      - name: Execute Nifty Algo Script
        run: |
          python nifty_algo.py

      - name: Save Order & Trade Books (If Generated)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orders_book.csv trades_book.csv nifty_auto_itm_algo.log 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update Nifty order & trade books [skip ci]"
            git push
          fi

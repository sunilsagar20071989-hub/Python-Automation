name: Nifty 15-Min Algo Workflow

on:
  schedule:
    # Runs every 15 minutes during trading hours (9:15 AM to 3:30 PM IST)
    - cron: '*/15 4-9 * * 1-5'
  workflow_dispatch: # Manual run button for testing

jobs:
  run-nifty-algo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyotp smartapi-python
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Nifty Algo
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nifty_algo.py

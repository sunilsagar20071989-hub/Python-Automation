name: Run Nifty Algo

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '40 3 * * 1-5' # Runs at 09:10 AM IST (Mon-Fri)

jobs:
  run-algo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pandas ta pytz requests python-dotenv pyotp logzero websocket-client

      - name: Auto-Clean Non-Breaking Spaces
        run: |
          python -c "
          import glob
          for filepath in glob.glob('*.py'):
              with open(filepath, 'rb') as f:
                  content = f.read()
              cleaned = content.replace(b'\xc2\xa0', b' ')
              with open(filepath, 'wb') as f:
                  f.write(cleaned)
          "
          sed -i 's/\xc2\xa0/ /g' *.py || true

      - name: Execute Algo Script
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "Asia/Kolkata"
        run: python nifty_algo.py

name: Run Nifty Algo

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1-5'

jobs:
  run-algo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pandas ta pytz requests python-dotenv pyotp

      - name: Execute Algo Script
        env:
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_CODE: ${{ secrets.SMARTAPI_CLIENT_CODE }}
          SMARTAPI_PIN: ${{ secrets.SMARTAPI_PIN }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Dhoondho aur run karo (wildcard search)
          SCRIPT_FILE=$(find . -maxdepth 2 -name "*.py" ! -name "test*.py" | head -n 1)
          echo "Executing Script: $SCRIPT_FILE"
          python "$SCRIPT_FILE"
